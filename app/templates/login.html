{% extends "base.html" %}
{% block title %}Login —  app_name {% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <p class="muted">Welcome back. Log in to run OSINT lookups.</p>
  {% if error %}<div class="alert alert-error"> error </div>{% endif %}
  <form method="post" action="/login" class="form">
    <label>Username
      <input type="text" name="username" value=" username or '' " autocomplete="username" required autofocus />
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="muted center">No account? <a href="/register">Create one</a></p>
</div>
{% endblock %}
